name: update-and-deploy

on:
  schedule:
    # 每天北京时间 18:01 拉取一次（GitHub Actions cron 按 UTC，18:01 CST = 10:01 UTC）
    - cron: "1 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制全量拉取上游（忽略 20 小时间隔）"
        type: boolean
        default: true
      batch:
        description: "本轮验证条数上限"
        type: string
        default: "800"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shuyuan-keeper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore validation state (store.json)
        uses: actions/cache@v4
        with:
          path: data/store.json
          # 滚动缓存：每次运行新建 key，靠前缀恢复上一轮状态
          key: keeper-store-${{ github.run_id }}
          restore-keys: |
            keeper-store-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch upstreams
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python scripts/keeper.py fetch --force
          else
            python scripts/keeper.py fetch
          fi

      - name: Validate sources
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/keeper.py validate --batch "${{ inputs.batch }}"
          else
            python scripts/keeper.py validate --batch 2000
          fi

      - name: Ingest user submissions
        run: |
          if [ -d data/user_submit ] && [ -n "$(ls -A data/user_submit/*.json 2>/dev/null)" ]; then
            python scripts/keeper.py ingest
          fi

      - name: Export artifacts
        run: python scripts/keeper.py export

      - name: Commit user submissions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/user_submit
          if git diff --cached --quiet; then
            echo "no user submissions"
          else
            git commit -m "chore(user-submissions): auto-ingest pending items"
            git push
          fi

      - name: Sync site to cPanel host (FTP)
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          FTP_DIR: htdocs
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "FTP secrets not set, skip cPanel sync"
            exit 0
          fi
          python - <<'PY'
          import ftplib, os
          ftp=ftplib.FTP()
          ftp.connect(os.environ["FTP_HOST"],21,timeout=60)
          ftp.login(os.environ["FTP_USER"],os.environ["FTP_PASS"])
          base=os.environ.get("FTP_DIR","htdocs")
          for f in sorted(os.listdir("docs")):
              try:
                  with open(os.path.join("docs",f),"rb") as fh:
                      ftp.storbinary(f"STOR {base}/{f}",fh,blocksize=32768)
                  print("  up:",f)
              except Exception as e:
                  print(f"  WARN: upload {f} failed: {e}")
          try:
              ftp.cwd(base)
              print("remote now:",sorted(ftp.nlst())[:50])
          except Exception as e:
              print("verify warn:",e)
          ftp.quit()
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
