name: update-and-deploy

on:
  schedule:
    # 每2天跑一次（UTC 10:00 = 北京18:00）
    # 效率最优：源站变化不快，2天足够新鲜度
    # 每月约15次 × 8分钟 ≈ 120分钟，远低于免费额度
    - cron: "0 10 */2 * *"
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "强制拉取上游（无视 8 天窗口）"
        type: boolean
        default: true
      skip_known:
        description: "只收新增（已入库条目不重复合并）"
        type: boolean
        default: true
      validate_all:
        description: "全量验证（无视 15 天有效期）"
        type: boolean
        default: false
      batch:
        description: "本轮验证条数上限"
        type: string
        default: "300"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shuyuan-keeper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore validation state (store.json)
        uses: actions/cache@v4
        with:
          path: data/store.json
          # 滚动缓存：每次运行新建 key，靠前缀恢复上一轮状态
          key: keeper-store-${{ github.run_id }}
          restore-keys: |
            keeper-store-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync fetch & validate schedule
        env:
          INPUT_FORCE_FETCH: ${{ inputs.force_fetch }}
          INPUT_SKIP_KNOWN: ${{ inputs.skip_known }}
          INPUT_VALIDATE_ALL: ${{ inputs.validate_all }}
          INPUT_BATCH: ${{ inputs.batch }}
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          store_path = "data/store.json"
          if os.path.exists(store_path):
              store = json.load(open(store_path))
          else:
              store = {"sources": [], "archived": [], "dead": {},
                       "last_fetch": 0, "discovered": [], "upstreams": {},
                       "updated_at": None}
              open(store_path, "w").write(json.dumps(store, ensure_ascii=False))

          now_dt = datetime.now(timezone.utc)
          now_ts = now_dt.timestamp()

          fetch_gap_days = 6

          force_fetch = str(os.environ.get("INPUT_FORCE_FETCH", "")).lower() == "true"
          skip_known = str(os.environ.get("INPUT_SKIP_KNOWN", "")).lower() == "true"
          validate_all = str(os.environ.get("INPUT_VALIDATE_ALL", "")).lower() == "true"
          batch = os.environ.get("INPUT_BATCH", "800")

          # 每次跑都验证（cron已经是2天一次了，不需要再隔一天）
          last_val_day = store.get("last_validate_day", "")
          store["should_validate"] = True
          print(f"[schedule] 每次运行都验证")

          last_fetch = store.get("last_fetch", 0)
          fetch_age_days = (now_ts - last_fetch) / 86400 if last_fetch else 10**9
          if force_fetch:
              store["should_fetch"] = True
              print(f"[schedule] force_fetch，强制拉取（跳过 {fetch_age_days:.1f} 天）")
          elif fetch_age_days >= fetch_gap_days:
              store["should_fetch"] = True
              print(f"[schedule] 距上次拉取 {fetch_age_days:.1f} 天 >= {fetch_gap_days} 天，进入拉取")
          else:
              store["should_fetch"] = False
              print(f"[schedule] 距上次拉取 {fetch_age_days:.1f} 天 < {fetch_gap_days} 天，跳过拉取")

          store["should_skip_known"] = skip_known
          store["should_validate_all"] = validate_all
          store["validate_batch"] = int(batch)
          json.dump(store, open(store_path, "w"), ensure_ascii=False, indent=2)
          PY

      - name: Auto-discover upstreams
        continue-on-error: true
        run: python scripts/keeper.py discover

      - name: Fetch upstreams (8-day window)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, subprocess
          store = json.load(open("data/store.json"))
          if store.get("should_fetch"):
              # 外层 8 天窗口已判定该拉取：--force 绕过 keeper 内部 8 天守卫，
              # --skip-known 只收新增条目，已入库的不再重复合并
              args = ["python", "scripts/keeper.py", "fetch", "--force", "--skip-known"]
              print("[fetch]", " ".join(args))
              subprocess.run(args, check=False)
          else:
              print("[fetch] 8 天窗口未到，跳过拉取")
          PY

      - name: Validate sources
        continue-on-error: true
        env:
          KEEPER_READ_TIMEOUT: "15"
          KEEPER_ALIVE_TIMEOUT: "12"
          KEEPER_AI_REPAIR: "1"
          KEEPER_AI_MAKE: "1"
        run: |
          python - <<'PY'
          import json, subprocess, time
          store = json.load(open("data/store.json"))
          if not store.get("should_validate"):
              print("[validate] 未到时间，跳过校验")
          else:
              # 主验证：200条，避免限流
              args = ["python", "scripts/keeper.py", "validate",
                      "--batch", str(store.get("validate_batch", 200))]
              print("[validate]", " ".join(args))
              subprocess.run(args, check=False)
              # 间隔30秒再跑flaky，避免连续请求被限流
              time.sleep(30)
              # flaky深修：200条
              flaky_args = ["python", "scripts/keeper.py", "validate",
                            "--flaky", "--batch", "200"]
              print("[validate --flaky]", " ".join(flaky_args))
              subprocess.run(flaky_args, check=False)
              from datetime import datetime, timezone
              store["last_validate_day"] = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              json.dump(store, open("data/store.json", "w"), ensure_ascii=False)
          PY

      - name: Ingest user submissions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 从GitHub Issues拉取用户提交的源
          mkdir -p data/user_submit
          python - <<'PY'
          import os, json, re, urllib.request
          token = os.environ.get("GH_TOKEN","")
          req = urllib.request.Request(
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=user-submit&per_page=10",
            headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  issues = json.loads(r.read())
              for issue in issues:
                  body = issue.get("body","")
                  # 提取代码块
                  m = re.search(r"```\n(.*?)```", body, re.DOTALL)
                  if m:
                      content = m.group(1).strip()
                      fn = f"data/user_submit/issue_{issue['number']}.json"
                      with open(fn, "w") as f:
                          f.write(content)
                      print(f"  📥 Issue#{issue['number']}: 已保存")
          except Exception as e:
              print(f"拉取Issues失败: {e}")
          PY
          # 处理提交的源
          if [ -n "$(ls data/user_submit/*.json 2>/dev/null)" ]; then
            python scripts/keeper.py ingest
          fi

      - name: Setup Node.js (for drpy-node T4 test)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup drpy-node for T4 testing
        run: |
          echo "Setting up drpy-node..."
          git clone --depth 1 https://github.com/hjdhnx/drpy-node /tmp/drpy-node 2>/dev/null || echo "drpy-node clone failed, T4 test will be skipped"
          cd /tmp/drpy-node && npm install --production 2>&1 | tail -3 || echo "npm install failed"
          # Start drpy-node in background
          nohup node index.js > /tmp/drpy.log 2>&1 &
          sleep 5
          curl -s -m 5 http://127.0.0.1:5757/ && echo " drpy-node OK" || echo " drpy-node not ready, T4 skipped"

      - name: Convert Legado books to drpy scripts (with T4)
        env:
          KEEPER_AI_BASE: ${{ secrets.KEEPER_AI_BASE }}
          KEEPER_AI_KEY: ${{ secrets.KEEPER_AI_KEY }}
          KEEPER_AI_MODEL: ${{ secrets.KEEPER_AI_MODEL }}
          CONVERT_BOOKS_LIMIT: "20"
          DRPY_NODE_DIR: /tmp/drpy-node
        run: python scripts/keeper.py convert-books

      - name: Export artifacts
        env:
          KEEPER_AI_CLASSIFY: "1"
        run: |
          python scripts/keeper.py export
          python scripts/keeper.py drpy-pack

      - name: Commit generated docs (valid/peek exports)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no docs changes"
          else
            git commit -m "chore(docs): refresh valid/peek exports"
            git pull --rebase origin main
            git push
          fi

      - name: Commit user submissions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/user_submit
          if git diff --cached --quiet; then
            echo "no user submissions"
          else
            git commit -m "chore(user-submissions): auto-ingest pending items"
            git push
          fi

      - name: Sync site to cPanel host (FTPS)
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          FTP_DIR: htdocs
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "FTP secrets not set, skip cPanel sync"
            exit 0
          fi
          python - <<'PY'
          import ftplib, os, ssl, time, socket
          socket.setdefaulttimeout(30)
          
          def upload_dir(ftp, local_dir, remote_dir):
            uploaded = 0
            for f in sorted(os.listdir(local_dir)):
                lp = os.path.join(local_dir, f)
                rp = f"{remote_dir}/{f}"
                if os.path.isdir(lp):
                    try: ftp.mkd(rp)
                    except: pass
                    uploaded += upload_dir(ftp, lp, rp)
                    continue
                if f.endswith((".jpg",".png",".gif",".zip",".mp4",".apk")):
                    continue
                for attempt in range(3):
                    try:
                        with open(lp, "rb") as fh:
                            ftp.storbinary(f"STOR {rp}", fh, blocksize=32768)
                        uploaded += 1
                        break
                    except Exception as e:
                        if attempt == 2:
                            print(f"  ✗ {f}: {e}")
                        else:
                            time.sleep(2)
            return uploaded
          
          total = 0
          for attempt in range(3):
            try:
              ftp = ftplib.FTP_TLS(context=ssl._create_unverified_context())
              ftp.connect(os.environ["FTP_HOST"], 21, timeout=30)
              ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
              ftp.prot_p()
              base = os.environ.get("FTP_DIR", "htdocs")
              total = upload_dir(ftp, "docs", base)
              ftp.quit()
              break
            except Exception as e:
              print(f"FTP连接失败({attempt+1}/3): {e}")
              time.sleep(5)
          print(f"\n已上传 {total} 个文件到 {base}/")
          PY

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
